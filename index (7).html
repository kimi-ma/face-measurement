<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>tles VISUAL SUCCESS ── 顔計測</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" />
<style>
  :root {
    --ink: #0B0B0A;
    --paper: #F4EFE4;
    --gold: #C6A15B;
    --deep-gold: #8B6E3B;
    --line: #3A3630;
    --muted: #9C9384;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 50% 0%, #17150F 0%, var(--ink) 55%);
    color: var(--paper);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 60px;
  }
  .serif { font-family: 'Shippori Mincho', serif; }
  header { width: 100%; max-width: 480px; padding: 40px 24px 24px; text-align: center; box-sizing: border-box; }
  .eyebrow { font-size: 13px; letter-spacing: 0.35em; color: var(--gold); margin-bottom: 10px; }
  h1 { font-weight: 600; font-size: 26px; margin: 0; letter-spacing: 0.05em; }
  .sub { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); margin-top: 8px; }
  main { width: 100%; max-width: 480px; padding: 0 20px; box-sizing: border-box; }
  .card {
    border: 1px solid #332F27;
    border-radius: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    padding: 20px;
  }
  .preview {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    border-radius: 4px;
    border: 1px dashed var(--deep-gold);
    overflow: hidden;
    background: #141210;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .preview.has-img { border: 1px solid var(--line); cursor: default; }
  .preview img { width: 100%; height: 100%; object-fit: cover; }
  .placeholder { text-align: center; padding: 24px; }
  .placeholder .plus { font-size: 28px; color: var(--gold); margin-bottom: 10px; }
  .placeholder .txt { font-size: 13px; color: var(--muted); line-height: 1.8; }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    flex: 1; padding: 13px 0; border-radius: 3px; font-size: 13px; letter-spacing: 0.05em;
    cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--paper);
    font-family: 'Noto Sans JP', sans-serif;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--gold), var(--deep-gold));
    color: var(--ink); border: none; font-family: 'Shippori Mincho', serif;
    font-weight: 600; font-size: 14px; letter-spacing: 0.1em;
  }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); flex: none; padding: 13px 18px; }
  .btn-outline { background: transparent; color: var(--gold); border: 1px solid var(--deep-gold); flex: none; padding: 13px 18px; }
  .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; line-height: 1.7; }
  .error { margin-top: 12px; font-size: 12px; color: #D98A6B; }
  input[type=file] { display: none; }
  #adjustStage { position: relative; width: 100%; aspect-ratio: 3/4; border-radius: 4px; border: 1px solid var(--line); overflow: hidden; background: #141210; touch-action: none; cursor: grab; }
  #adjustStage.dragging { cursor: grabbing; }
  #adjustImg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; pointer-events: none; transform-origin: center center; }
  #adjustGuide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.85; }
  .zoom-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .zoom-row span { font-size: 11px; color: var(--muted); }
  .zoom-row input[type=range] { flex: 1; accent-color: var(--gold); }
  .badge {
    display: inline-block; font-size: 10px; letter-spacing: 0.1em; padding: 4px 10px;
    border-radius: 20px; border: 1px solid var(--gold); color: var(--gold);
  }
  .badge-row { text-align: center; margin-bottom: 4px; }
  .shape-block { text-align: center; padding: 8px 0 22px; }
  .shape-block .label { font-size: 11px; letter-spacing: 0.2em; color: var(--muted); }
  .shape-block .value { font-family: 'Shippori Mincho', serif; font-size: 32px; font-weight: 600; color: var(--gold); margin: 6px 0; }
  .shape-block .note { font-size: 12px; color: #C9C2B2; }
  .section { margin-top: 22px; }
  .section-title { font-size: 11px; letter-spacing: 0.2em; color: var(--deep-gold); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section-title .dash { width: 14px; height: 1px; background: var(--deep-gold); display: inline-block; }
  .stat-row { display: flex; gap: 12px; }
  .stat-card { flex: 1; border: 1px solid #2A2722; border-radius: 4px; padding: 14px 8px; text-align: center; }
  .stat-card .label { font-size: 10px; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 6px; }
  .stat-card .value { font-family: 'Shippori Mincho', serif; font-size: 18px; color: var(--gold); }
  .stat-card .sub { font-size: 10px; color: #6B6862; margin-top: 2px; }
  .bar-row { margin-bottom: 14px; }
  .bar-row .top { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 0.05em; color: #C9C2B2; margin-bottom: 6px; }
  .bar-row .top .v { color: var(--gold); font-weight: 500; }
  .bar-track { height: 3px; background: #2A2722; border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg,#8B6E3B,#C6A15B); transition: width 1.1s cubic-bezier(.16,1,.3,1); width: 0%; }
  .note-text { font-size: 12px; color: var(--muted); line-height: 1.8; margin-top: 4px; }
  footer { margin-top: 40px; font-size: 10px; color: #5C574C; letter-spacing: 0.1em; text-align: center; line-height: 1.9; padding: 0 24px; }
  .status-text { flex: 1; padding: 13px 0; text-align: center; font-size: 13px; letter-spacing: 0.1em; color: var(--gold); }

  /* ── ワークシートオーバーレイ ── */
  #worksheetOverlay {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 1000; align-items: center; justify-content: center; flex-direction: column;
    padding: 20px;
  }
  #worksheetOverlay.active { display: flex; }
  #worksheetFrame {
    width: 100%; max-width: 700px; height: 80vh;
    border: none; border-radius: 4px; background: #fff;
  }
  .ws-btn-row {
    display: flex; gap: 12px; margin-top: 12px;
  }
  .ws-btn {
    padding: 12px 24px; border-radius: 3px; font-size: 13px; cursor: pointer;
    border: none; font-family: 'Noto Sans JP', sans-serif; letter-spacing: 0.05em;
  }
  .ws-btn-print { background: linear-gradient(135deg, #C6A15B, #8B6E3B); color: #0B0B0A; font-weight: 600; }
  .ws-btn-close { background: transparent; color: #9C9384; border: 1px solid #3A3630; }

  /* ── 印刷用スタイル ── */
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    html, body {
      width: 210mm;
      height: 297mm;
      margin: 0;
      padding: 0;
      background: #fff !important;
      color: #1a1a1a !important;
      font-size: 10pt;
      overflow: hidden;
    }

    /* 画面表示要素をすべて非表示 */
    header, footer, .card, #worksheetOverlay,
    .btn-row, .btn, .hint, .error,
    #adjustStage, .zoom-row { display: none !important; }

    /* 結果エリアだけ表示 */
    main { display: block !important; padding: 0 !important; margin: 0 !important; max-width: 100% !important; }

    /* 印刷専用ワークシートを表示 */
    #printSheet {
      display: block !important;
      width: 210mm;
      height: 297mm;
      padding: 12mm 12mm 10mm;
      box-sizing: border-box;
      page-break-after: avoid;
      background: #fff;
      overflow: hidden;
    }
  }

  /* 印刷専用シート（通常は非表示） */
  #printSheet { display: none; }
</style>

  <header>
    <div class="eyebrow">T L E S &nbsp;/&nbsp; VISUAL SUCCESS</div>
    <h1 class="serif">顔計測 ── 468点実測</h1>
    <div class="sub">MediaPipe Face Mesh による実座標ベースの計測（ログイン不要）</div>
  </header>
  <main id="main"></main>

  <!-- 印刷専用シート（@media printで表示） -->
  <div id="printSheet"></div>

  <footer>
    tles TRIAD ── VISUAL SUCCESS<br />

  </footer>

<script type="module">
import { FilesetResolver, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

// ---------------------------------------------------------------------------
// 状態管理
// ---------------------------------------------------------------------------
const state = {
  status: "idle",
  imgSrc: null,
  imgW: 0, imgH: 0,
  rawImage: null,
  zoom: 1, pan: { x: 0, y: 0 },
  landmarks468: null,
  namedLandmarks: null,
  measurements: null,
  faceShape: null,
  faceShapeNote: "",
  errorMsg: "",
};

const mainEl = document.getElementById("main");

// ---------------------------------------------------------------------------
// MediaPipe FaceLandmarker
// ---------------------------------------------------------------------------
let faceLandmarkerPromise = null;
function getFaceLandmarker() {
  if (!faceLandmarkerPromise) {
    faceLandmarkerPromise = (async () => {
      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      return await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU",
        },
        runningMode: "IMAGE",
        numFaces: 1,
        outputFaceBlendshapes: false,
        outputFacialTransformationMatrixes: false,
      });
    })();
  }
  return faceLandmarkerPromise;
}
getFaceLandmarker().catch(() => {});

// ---------------------------------------------------------------------------
// 基準点インデックス
// ---------------------------------------------------------------------------
const IDX = {
  chinTip: 152,
  cheekboneLeft: 234,   // 頬骨左（顔型判定用）
  cheekboneRight: 454,  // 頬骨右（顔型判定用）
  jawLeft: 172,
  jawRight: 397,
  jawAngleLeft: 58,     // エラ左
  jawAngleRight: 288,   // エラ右
  jawMidLeft: 172,      // 顎中間左（直線性計算用）
  jawMidRight: 397,     // 顎中間右
  noseBottom: 2,
  faceEdgeLeft: 127,    // 顔輪郭幅左（五眼計算用）
  faceEdgeRight: 356,   // 顔輪郭幅右
  foreheadEdgeLeft: 54, // 額幅左（顔型判定用）
  foreheadEdgeRight: 284,// 額幅右
  eyeOuterLeft: 33,
  eyeInnerLeft: 133,
  eyeInnerRight: 362,
  eyeOuterRight: 263,
  glabella: 168,
  noseTip: 4,
  philtrum: 164,
  mouthCornerLeft: 61,
  mouthCornerRight: 291,
  eyeTopLeft: 159,
  eyeBottomLeft: 145,
  eyeTopRight: 386,
  eyeBottomRight: 374,
  eyebrowOuterLeft: 46,
  eyebrowOuterRight: 276,
  noseAlaLeft: 129,
  noseAlaRight: 358,
  mouthTopCenter: 0,
};

// 眉上端インデックス（三分割の眉ライン用）
const BROW_TOP_LEFT  = [52, 53, 65, 105];
const BROW_TOP_RIGHT = [282, 283, 295, 334];
// 生え際用額メッシュ点
const HAIRLINE_MESH = [10, 109, 338, 67, 297];

function extractNamedLandmarks(raw) {
  const lm = {};
  for (const [name, idx] of Object.entries(IDX)) {
    const p = raw[idx];
    if (p) lm[name] = { x: p.x, y: p.y };
  }

  // 眉ライン: 左右それぞれの眉上端インデックスの最小Y（最も上の点）
  const browTopLPoints = BROW_TOP_LEFT.map(i => raw[i]).filter(Boolean);
  const browTopRPoints = BROW_TOP_RIGHT.map(i => raw[i]).filter(Boolean);
  if (browTopLPoints.length && browTopRPoints.length) {
    const browTopL = browTopLPoints.reduce((a, b) => a.y < b.y ? a : b);
    const browTopR = browTopRPoints.reduce((a, b) => a.y < b.y ? a : b);
    lm.browLine = {
      x: (browTopL.x + browTopR.x) / 2,
      y: (browTopL.y + browTopR.y) / 2,
    };
  }

  // 生え際: 額メッシュ点の最上点を使用（外挿なし）
  const hairlineMeshPoints = HAIRLINE_MESH.map(i => raw[i]).filter(Boolean);
  if (hairlineMeshPoints.length) {
    const topPoint = hairlineMeshPoints.reduce((a, b) => a.y < b.y ? a : b);
    lm.hairline = { x: topPoint.x, y: topPoint.y };
  }

  const avg = (pts) => ({
    x: pts.reduce((s, p) => s + p.x, 0) / pts.length,
    y: pts.reduce((s, p) => s + p.y, 0) / pts.length,
  });
  if (lm.eyeOuterLeft && lm.eyeInnerLeft && lm.eyeTopLeft && lm.eyeBottomLeft) {
    lm.pupilLeft = avg([lm.eyeOuterLeft, lm.eyeInnerLeft, lm.eyeTopLeft, lm.eyeBottomLeft]);
  }
  if (lm.eyeOuterRight && lm.eyeInnerRight && lm.eyeTopRight && lm.eyeBottomRight) {
    lm.pupilRight = avg([lm.eyeOuterRight, lm.eyeInnerRight, lm.eyeTopRight, lm.eyeBottomRight]);
  }
  return lm;
}

// ---------------------------------------------------------------------------
// 計測ロジック
// ---------------------------------------------------------------------------
const ASSUMED_PUPIL_DISTANCE_CM = 6.3;

function toPx(p, w, h) {
  if (!p) return null;
  return { x: p.x * w, y: p.y * h };
}
function distPx(a, b) {
  if (!a || !b) return null;
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function computeMeasurements(lm, imgW, imgH) {
  if (!lm || !imgW || !imgH) return null;
  const px = {};
  Object.keys(lm).forEach((k) => { px[k] = toPx(lm[k], imgW, imgH); });

  const pupilDistPx = distPx(px.pupilLeft, px.pupilRight);
  const cmPerPx = pupilDistPx ? ASSUMED_PUPIL_DISTANCE_CM / pupilDistPx : null;
  const toCm = (pxLen) => (cmPerPx && pxLen != null ? Math.round(pxLen * cmPerPx * 10) / 10 : null);

  const faceHeightPx = distPx(px.hairline, px.chinTip);
  const faceWidthPx  = distPx(px.cheekboneLeft, px.cheekboneRight);
  const faceRatio    = faceHeightPx && faceWidthPx ? faceHeightPx / faceWidthPx : null;
  const jawWidthPx        = distPx(px.jawLeft, px.jawRight);
  const jawAngleWidthPx   = distPx(px.jawAngleLeft, px.jawAngleRight);
  const foreheadWidthPx   = distPx(px.foreheadEdgeLeft, px.foreheadEdgeRight);

  // ── 顎ライン直線性スコア ──
  let jawLinearityScore = null;
  const calcLinearity = (angleP, midP, endP, faceW) => {
    if (!angleP || !midP || !endP || !faceW) return null;
    const dist = Math.abs(
      (endP.y - angleP.y) * midP.x - (endP.x - angleP.x) * midP.y
      + endP.x * angleP.y - endP.y * angleP.x
    ) / Math.hypot(endP.x - angleP.x, endP.y - angleP.y || 1);
    return dist / faceW;
  };
  const linL = calcLinearity(px.jawAngleLeft,  px.jawMidLeft,  px.chinTip, faceWidthPx);
  const linR = calcLinearity(px.jawAngleRight, px.jawMidRight, px.chinTip, faceWidthPx);
  if (linL !== null && linR !== null) jawLinearityScore = (linL + linR) / 2;

  // ── 顔型判定（実測データ30人以上で調整済み）──
  let faceShape = null;
  let faceShapeNote = "";
  if (faceRatio && jawWidthPx && foreheadWidthPx && faceWidthPx) {
    const jawToCheek      = jawWidthPx      / faceWidthPx;
    const foreheadToCheek = foreheadWidthPx / faceWidthPx;
    const widthToHeight   = faceWidthPx     / (faceHeightPx || 1);

    // 判定優先順位: 面長 > ダイヤモンド型 > ベース型 > 逆三角形 > 丸型 > 卵型
    // ※ 閾値はボーダーラインのブレを最小化するためやや余裕を持たせている
    if (widthToHeight < 0.76) {
      faceShape = "面長";
      // サブ特徴
      if (foreheadToCheek < 0.97 && jawToCheek < 0.88) {
        faceShapeNote = "頬骨張り出し傾向";
      } else if (jawToCheek < 0.90 && foreheadToCheek >= 0.93 && foreheadToCheek < 0.98) {
        faceShapeNote = "逆三角傾向";
      }
    } else if (foreheadToCheek < 0.93 && jawToCheek < 0.83
               && Math.abs(foreheadToCheek - jawToCheek) < 0.12) {
      // ダイヤモンド型: 頬骨が額・顎より明確に張り出し、上下がほぼ対称
      faceShape = "ダイヤモンド型";
    } else if (jawLinearityScore !== null && jawLinearityScore < 0.065) {
      faceShape = "ベース型";
    } else if (foreheadToCheek >= 0.93 && jawToCheek < 0.75 && widthToHeight > 0.72) {
      faceShape = "逆三角形";
    } else if (widthToHeight > 0.86 && jawToCheek < 0.87) {
      faceShape = "丸型";
    } else {
      faceShape = "卵型";
      // サブ特徴
      if (foreheadToCheek < 0.97 && jawToCheek < 0.88) {
        faceShapeNote = "頬骨張り出し傾向";
      } else if (jawToCheek < 0.90 && foreheadToCheek >= 0.93 && foreheadToCheek < 0.98) {
        faceShapeNote = "逆三角傾向";
      }
    }
  }

  // ── 三分割 ──
  let thirds = null;
  if (px.hairline && px.browLine && px.noseBottom && px.chinTip) {
    const foreheadPx  = px.browLine.y  - px.hairline.y;
    const midfacePx   = px.noseBottom.y - px.browLine.y;
    const lowerfacePx = px.chinTip.y   - px.noseBottom.y;
    const totalPx     = px.chinTip.y   - px.hairline.y || 1;
    thirds = {
      forehead:   Math.round((foreheadPx  / totalPx) * 100),
      midface:    Math.round((midfacePx   / totalPx) * 100),
      lowerface:  Math.round((lowerfacePx / totalPx) * 100),
      foreheadCm: toCm(foreheadPx),
      midfaceCm:  toCm(midfacePx),
      lowerfaceCm:toCm(lowerfacePx),
    };
  }

  // ── 五眼 ──
  let fiveEyes = null;
  if (px.faceEdgeLeft && px.eyeOuterLeft && px.eyeInnerLeft && px.eyeInnerRight && px.eyeOuterRight && px.faceEdgeRight) {
    const s1px = px.eyeOuterLeft.x  - px.faceEdgeLeft.x;
    const s2px = px.eyeInnerLeft.x  - px.eyeOuterLeft.x;
    const s3px = px.eyeInnerRight.x - px.eyeInnerLeft.x;
    const s4px = px.eyeOuterRight.x - px.eyeInnerRight.x;
    const s5px = px.faceEdgeRight.x - px.eyeOuterRight.x;
    const totalPx = px.faceEdgeRight.x - px.faceEdgeLeft.x || 1;

    // 求心・遠心判定: 目頭間 ÷ 顔全幅 × 100
    const innerDistPx = px.eyeInnerRight.x - px.eyeInnerLeft.x;
    const outerDistPx = px.faceEdgeRight.x - px.faceEdgeLeft.x;
    const innerRatio  = outerDistPx ? (innerDistPx / outerDistPx) * 100 : null;
    let eyeSetType = "標準";
    if (innerRatio !== null) {
      if (innerRatio < 41)      eyeSetType = "求心";
      else if (innerRatio > 46) eyeSetType = "遠心";
    }

    fiveEyes = {
      section1: Math.round((s1px / totalPx) * 100), section1Cm: toCm(s1px),
      section2: Math.round((s2px / totalPx) * 100), section2Cm: toCm(s2px),
      section3: Math.round((s3px / totalPx) * 100), section3Cm: toCm(s3px),
      section4: Math.round((s4px / totalPx) * 100), section4Cm: toCm(s4px),
      section5: Math.round((s5px / totalPx) * 100), section5Cm: toCm(s5px),
      innerRatio: innerRatio ? Math.round(innerRatio) : null,
      eyeSetType,
    };
  }

  // ── 目の左右差 ──
  let eyeSize = null;
  const eyeWidthLeftPx   = distPx(px.eyeOuterLeft,  px.eyeInnerLeft);
  const eyeWidthRightPx  = distPx(px.eyeOuterRight, px.eyeInnerRight);
  const eyeHeightLeftPx  = distPx(px.eyeTopLeft,    px.eyeBottomLeft);
  const eyeHeightRightPx = distPx(px.eyeTopRight,   px.eyeBottomRight);
  if (eyeWidthLeftPx && eyeWidthRightPx && eyeHeightLeftPx && eyeHeightRightPx) {
    const widthDiffPct  = (Math.abs(eyeWidthLeftPx  - eyeWidthRightPx)  / ((eyeWidthLeftPx  + eyeWidthRightPx)  / 2)) * 100;
    const heightDiffPct = (Math.abs(eyeHeightLeftPx - eyeHeightRightPx) / ((eyeHeightLeftPx + eyeHeightRightPx) / 2)) * 100;
    const widthLeftCm   = toCm(eyeWidthLeftPx),  widthRightCm  = toCm(eyeWidthRightPx);
    const heightLeftCm  = toCm(eyeHeightLeftPx), heightRightCm = toCm(eyeHeightRightPx);
    const leftSumCm  = (widthLeftCm  ?? 0) + (heightLeftCm  ?? 0);
    const rightSumCm = (widthRightCm ?? 0) + (heightRightCm ?? 0);
    eyeSize = {
      widthLeftCm, widthRightCm, heightLeftCm, heightRightCm,
      widthDiffCm: toCm(Math.abs(eyeWidthLeftPx - eyeWidthRightPx)),
      widthDiffPct: Math.round(widthDiffPct), heightDiffPct: Math.round(heightDiffPct),
      largerSide:
        leftSumCm > rightSumCm  ? "左目の方が大きい"
        : rightSumCm > leftSumCm ? "右目の方が大きい"
        : "ほぼ同じ",
    };
  }

  // ── 左右差スコア ──
  let symmetry = null;
  const centerPts = [px.glabella, px.noseTip, px.philtrum, px.chinTip].filter(Boolean);
  if (centerPts.length >= 2 && faceWidthPx) {
    const avgX = centerPts.reduce((s, p) => s + p.x, 0) / centerPts.length;
    const centerDeviation = centerPts.reduce((s, p) => s + Math.abs(p.x - avgX), 0) / centerPts.length;
    const centerScore = Math.max(0, 100 - (centerDeviation / faceWidthPx) * 400);
    const pairs = [
      [px.pupilLeft, px.pupilRight],
      [px.mouthCornerLeft, px.mouthCornerRight],
      [px.eyebrowOuterLeft, px.eyebrowOuterRight],
      [px.noseAlaLeft, px.noseAlaRight],
      [px.eyeOuterLeft, px.eyeOuterRight],
    ].filter(([l, r]) => l && r);
    let mirrorScore = 100;
    if (pairs.length > 0) {
      let asymSum = 0;
      pairs.forEach(([l, r]) => {
        const dl = Math.abs(avgX - l.x);
        const dr = Math.abs(r.x - avgX);
        asymSum += Math.abs(dl - dr) / ((dl + dr) / 2 || 1);
      });
      mirrorScore = Math.max(0, 100 - (asymSum / pairs.length) * 100);
    }
    let eyeSizeScore = 100;
    if (eyeSize) eyeSizeScore = Math.max(0, 100 - (eyeSize.widthDiffPct + eyeSize.heightDiffPct));
    symmetry = Math.round((centerScore + mirrorScore + eyeSizeScore) / 3);
  }

  // ── 黄金比スコア ──
  let goldenRatio = null;
  if (faceRatio) {
    goldenRatio = Math.max(0, Math.round(100 - Math.abs(faceRatio - 1.618) * 60));
    goldenRatio = Math.min(100, goldenRatio);
  }

  return {
    faceHeightCm: toCm(faceHeightPx),
    faceWidthCm:  toCm(faceWidthPx),
    faceRatio:    faceRatio ? Math.round(faceRatio * 100) / 100 : null,
    thirds, fiveEyes, symmetry, eyeSize, goldenRatio, faceShape, faceShapeNote,
    calibrated: !!cmPerPx,
    // 生数値（デバッグ・閾値確認用）
    _raw: faceWidthPx && faceHeightPx ? {
      widthToHeight: Math.round((faceWidthPx / faceHeightPx) * 1000) / 1000,
      jawToCheek:    jawWidthPx && faceWidthPx ? Math.round((jawWidthPx / faceWidthPx) * 1000) / 1000 : null,
      foreToCheek:   foreheadWidthPx && faceWidthPx ? Math.round((foreheadWidthPx / faceWidthPx) * 1000) / 1000 : null,
      jawLinearity:  jawLinearityScore ? Math.round(jawLinearityScore * 1000) / 1000 : null,
    } : null,
  };
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("ファイルの読み込みに失敗しました"));
    reader.readAsDataURL(file);
  });
}
function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload  = () => resolve(img);
    img.onerror = () => reject(new Error("画像のデコードに失敗しました"));
    img.src = src;
  });
}
function getCoverGeometry(containerW, containerH, imgW, imgH, zoom) {
  const baseScale = Math.max(containerW / imgW, containerH / imgH);
  const scale = baseScale * zoom;
  const dW = imgW * scale, dH = imgH * scale;
  const maxPanX = dW >= containerW ? (dW - containerW) / 2 : (containerW - dW) / 2 + dW / 2;
  const maxPanY = dH >= containerH ? (dH - containerH) / 2 : (containerH - dH) / 2 + dH / 2;
  return { scale, dW, dH, maxPanX, maxPanY };
}

  const third1 = top + (bottom - top) / 3;

  return `
    <svg id="adjustGuide" viewBox="0 0 300 400" style="opacity:${opacity}">
      <ellipse cx="150" cy="205" rx="92" ry="130" fill="none" stroke="#C6A15B" stroke-width="2" stroke-dasharray="6 6" />
      <line x1="58" y1="${third1}" x2="242" y2="${third1}" stroke="#C6A15B" stroke-width="1" stroke-dasharray="3 5" opacity="0.6" />
      <line x1="58" y1="${third2}" x2="242" y2="${third2}" stroke="#C6A15B" stroke-width="1" stroke-dasharray="3 5" opacity="0.6" />
      <line x1="150" y1="${top}" x2="150" y2="${bottom}" stroke="#F4EFE4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    </svg>`;
}

// ---------------------------------------------------------------------------
// イベント配線
// ---------------------------------------------------------------------------
function wireNormalCard() {
  const previewArea   = document.getElementById("previewArea");
  const albumInput    = document.getElementById("fileInputAlbum");
  const cameraInput   = document.getElementById("fileInputCamera");
  const pickAlbumBtn  = document.getElementById("pickAlbumBtn");
  const pickCameraBtn = document.getElementById("pickCameraBtn");
  const analyzeBtn    = document.getElementById("analyzeBtn");
  const backToAdjustBtn = document.getElementById("backToAdjustBtn");
  const resetBtn      = document.getElementById("resetBtn");
  const printBtn      = document.getElementById("printBtn");

  if (previewArea && !state.imgSrc && state.status !== "loading") {
    previewArea.addEventListener("click", () => albumInput?.click());
  }
  pickAlbumBtn?.addEventListener("click",  () => albumInput.click());
  pickCameraBtn?.addEventListener("click", () => cameraInput.click());
  albumInput?.addEventListener("change",  (e) => handleFile(e.target.files?.[0]));
  cameraInput?.addEventListener("change", (e) => handleFile(e.target.files?.[0]));
  analyzeBtn?.addEventListener("click",   runAnalysis);
  backToAdjustBtn?.addEventListener("click", () => { state.status = "adjusting"; render(); });
  resetBtn?.addEventListener("click",    resetAll);

  // 印刷ボタン
  printBtn?.addEventListener("click", () => {
    const html = buildPrintSheet();
    if (!html) return;
    // 新しいウィンドウで開いて印刷ダイアログ
    const win = window.open("", "_blank");
    win.document.write(html);
    win.document.close();
    win.addEventListener("load", () => {
      setTimeout(() => {
        win.print();
      }, 500);
    });
  });

  document.querySelectorAll(".bar-fill").forEach((el) => {
    const pct = Number(el.dataset.pct) || 0;
    requestAnimationFrame(() => { el.style.width = pct + "%"; });
  });
  if (state.status === "done" && state.landmarks468) {
    drawLandmarkCanvas();
  }
}

let dragState = null;
function wireAdjustCard() {
  const stage      = document.getElementById("adjustStage");
  const img        = document.getElementById("adjustImg");
  const slider     = document.getElementById("zoomSlider");
  const confirmBtn = document.getElementById("confirmCropBtn");
  const resetBtn   = document.getElementById("adjustResetBtn");

  function applyTransform() {
    img.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
  }
  applyTransform();

  function clampPan(next, zoom) {
    const rect = stage.getBoundingClientRect();
    const { maxPanX, maxPanY } = getCoverGeometry(rect.width, rect.height, state.rawImage.width, state.rawImage.height, zoom);
    return {
      x: Math.max(-maxPanX, Math.min(maxPanX, next.x)),
      y: Math.max(-maxPanY, Math.min(maxPanY, next.y)),
    };
  }

  stage.addEventListener("pointerdown", (e) => {
    stage.setPointerCapture(e.pointerId);
    stage.classList.add("dragging");
    dragState = { x: e.clientX, y: e.clientY, panX: state.pan.x, panY: state.pan.y };
  });
  stage.addEventListener("pointermove", (e) => {
    if (!dragState) return;
    const dx = e.clientX - dragState.x;
    const dy = e.clientY - dragState.y;
    state.pan = clampPan({ x: dragState.panX + dx, y: dragState.panY + dy }, state.zoom);
    applyTransform();
  });
  function endDrag() { dragState = null; stage.classList.remove("dragging"); }
  stage.addEventListener("pointerup",     endDrag);
  stage.addEventListener("pointercancel", endDrag);

  slider.addEventListener("input", (e) => {
    const z = Number(e.target.value);
    state.zoom = z;
    state.pan  = clampPan(state.pan, z);
    applyTransform();
  });

  confirmBtn.addEventListener("click", () => {
    const rect      = stage.getBoundingClientRect();
    const containerW = rect.width, containerH = rect.height;
    const outW = 750;
    const outH = Math.round(outW * (containerH / containerW));
    const { dW, dH } = getCoverGeometry(containerW, containerH, state.rawImage.width, state.rawImage.height, state.zoom);
    const canvasScale = outW / containerW;
    const canvas = document.createElement("canvas");
    canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#141210";
    ctx.fillRect(0, 0, outW, outH);
    const dx = (containerW / 2 + state.pan.x - dW / 2) * canvasScale;
    const dy = (containerH / 2 + state.pan.y - dH / 2) * canvasScale;
    ctx.drawImage(state.rawImage.source, dx, dy, dW * canvasScale, dH * canvasScale);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
    state.imgSrc  = dataUrl;
    state.imgW    = outW;
    state.imgH    = outH;
    state.status  = "ready";
    state.landmarks468  = null;
    state.measurements  = null;
    render();
  });

  resetBtn.addEventListener("click", resetAll);
}

// ---------------------------------------------------------------------------
// ファイル選択・解析フロー
// ---------------------------------------------------------------------------
async function handleFile(file) {
  if (!file || !file.type.startsWith("image/")) {
    state.errorMsg = "画像ファイルを選択してください";
    state.status   = "error";
    render(); return;
  }
  state.errorMsg = "";
  state.imgSrc   = null;
  state.status   = "loading";
  render();
  try {
    const rawDataUrl = await fileToDataUrl(file);
    const img = await loadImageEl(rawDataUrl);
    state.rawImage = {
      source: img, displayUrl: rawDataUrl,
      width: img.naturalWidth || img.width,
      height: img.naturalHeight || img.height,
    };
    state.zoom   = 1.15;
    state.pan    = { x: 0, y: 0 };
    state.status = "adjusting";
  } catch (e) {
    state.errorMsg = `画像の読み込みに失敗しました（詳細: ${e?.message}）`;
    state.status   = "error";
  }
  render();
}

function resetAll() {
  Object.assign(state, {
    status: "idle", imgSrc: null, imgW: 0, imgH: 0, rawImage: null,
    zoom: 1, pan: { x: 0, y: 0 },
    landmarks468: null, namedLandmarks: null, measurements: null,
    faceShape: null, faceShapeNote: "", errorMsg: "",
  });
  render();
}

async function runAnalysis() {
  if (!state.imgSrc) return;
  state.status   = "analyzing";
  state.errorMsg = "";
  render();
  try {
    const landmarker = await getFaceLandmarker();
    const imgEl      = await loadImageEl(state.imgSrc);

    const result = landmarker.detect(imgEl);
    if (!result.faceLandmarks || result.faceLandmarks.length === 0) {
      throw new Error("顔を検出できませんでした。正面を向いた、顔全体が写る写真でお試しください。");
    }
    const raw          = result.faceLandmarks[0];
    const named        = extractNamedLandmarks(raw);
    const measurements = computeMeasurements(named, state.imgW, state.imgH);

    state.landmarks468   = raw;
    state.namedLandmarks = named;
    state.measurements   = measurements;
    state.faceShape      = measurements?.faceShape ?? null;
    state.faceShapeNote  = measurements?.faceShapeNote ?? "";
    state.status        = "done";
  } catch (e) {
    state.errorMsg = `計測に失敗しました（詳細: ${e?.message}）`;
    state.status   = "error";
  }
  render();
}

// ---------------------------------------------------------------------------
// 468点ランドマーク描画
// ---------------------------------------------------------------------------
function drawLandmarkCanvas() {
  const canvas = document.getElementById("landmarkCanvas");
  if (!canvas || !state.landmarks468) return;
  const w = state.imgW, h = state.imgH;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#00FF66";
  state.landmarks468.forEach((p, i) => {
    if (i >= 468) return;
    ctx.beginPath();
    ctx.arc(p.x * w, p.y * h, Math.max(1, w * 0.0022), 0, Math.PI * 2);
    ctx.fill();
  });

  const lm = state.namedLandmarks;
  if (lm) {
    const px = (p) => ({ x: p.x * w, y: p.y * h });
    if (lm.hairline && lm.browLine && lm.noseBottom && lm.chinTip) {
      ctx.strokeStyle = "rgba(198,161,91,0.5)";
      ctx.lineWidth = 1;
      [lm.hairline, lm.browLine, lm.noseBottom, lm.chinTip].forEach((p) => {
        const { y } = px(p);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      });
    }
    if (lm.faceEdgeLeft && lm.eyeOuterLeft && lm.eyeInnerLeft && lm.eyeInnerRight && lm.eyeOuterRight && lm.faceEdgeRight) {
      ctx.strokeStyle = "rgba(198,161,91,0.35)";
      ctx.lineWidth = 1;
      [lm.faceEdgeLeft, lm.eyeOuterLeft, lm.eyeInnerLeft, lm.eyeInnerRight, lm.eyeOuterRight, lm.faceEdgeRight].forEach((p) => {
        const { x } = px(p);
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      });
    }
    ctx.fillStyle = "#C6A15B";
    Object.values(lm).forEach((p) => {
      const { x, y } = px(p);
      ctx.beginPath(); ctx.arc(x, y, Math.max(2, w * 0.006), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#0B0B0A"; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = "#C6A15B";
    });
  }
}

render();
</script>
