<style>

    background: radial-gradient(circle at 50% 0%, #17150F 0%, var(--ink) 55%);

  .serif { font-family: 'Shippori Mincho', serif; }

  .placeholder .txt { font-size: 13px; color: var(--muted); line-height: 1.8; }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    flex: 1; padding: 13px 0; border-radius: 3px; font-size: 13px; letter-spacing: 0.05em;

  #adjustGuide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.85; }
  .zoom-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }

  .zoom-row input[type=range] { flex: 1; accent-color: var(--gold); }
  .badge { display: inline-block; font-size: 10px; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); }
  .badge-row { text-align: center; margin-bottom: 4px; }
  .shape-block { text-align: center; padding: 8px 0 22px; }
  .shape-block .label { font-size: 11px; letter-spacing: 0.2em; color: var(--muted); }
  .shape-block .value { font-family: 'Shippori Mincho', serif; font-size: 32px; font-weight: 600; color: var(--gold); margin: 6px 0; }
  .shape-block .note { font-size: 12px; color: #C9C2B2; }
  .section { margin-top: 22px; }
  .section-title { font-size: 11px; letter-spacing: 0.2em; color: var(--deep-gold); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section-title .dash { width: 14px; height: 1px; background: var(--deep-gold); display: inline-block; }
  .stat-row { display: flex; gap: 12px; }
  .stat-card { flex: 1; border: 1px solid #2A2722; border-radius: 4px; padding: 14px 8px; text-align: center; }
  .stat-card .label { font-size: 10px; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 6px; }

  .bar-row { margin-bottom: 14px; }

  .bar-track { height: 3px; background: #2A2722; border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg,#8B6E3B,#C6A15B); transition: width 1.1s cubic-bezier(.16,1,.3,1); width: 0%; }

  footer { margin-top: 40px; font-size: 10px; color: #5C574C; letter-spacing: 0.1em; text-align: center; line-height: 1.9; padding: 0 24px; }
  .status-text { flex: 1; padding: 13px 0; text-align: center; font-size: 13px; letter-spacing: 0.1em; color: var(--gold); }
  .thirds-guide { margin: 0 0 16px; border: 1px solid #2A2722; border-radius: 4px; overflow: hidden; }
  .thirds-zone { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; font-size: 12px; border-bottom: 1px solid #2A2722; }

  .thirds-zone .zone-range { font-size: 10px; color: #5C574C; margin-top: 2px; }

  .photo-box { width: 160px; height: 210px; border: 1px solid var(--gold); flex-shrink: 0; overflow: hidden; background: #e8e4d9; }
  .photo-box img { width: 100%; height: 100%; object-fit: cover; }

<script type="module">
import { FilesetResolver, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

// ── 状態管理 ──────────────────────────────────────────────────────────────
const state = {
  status: "idle",
  imgSrc: null, imgW: 0, imgH: 0,
  rawImage: null,
  zoom: 1, pan: { x: 0, y: 0 },
  landmarks468: null,
  namedLandmarks: null,
  measurements: null,
  faceShape: null,
  errorMsg: "",
};
const mainEl = document.getElementById("main");

// ── MediaPipe ──────────────────────────────────────────────────────────────
let faceLandmarkerPromise = null;
function getFaceLandmarker() {
  if (!faceLandmarkerPromise) {
    faceLandmarkerPromise = (async () => {
      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      return await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU",
        },
        runningMode: "IMAGE", numFaces: 1,
        outputFaceBlendshapes: false, outputFacialTransformationMatrixes: false,
      });
    })();
  }
  return faceLandmarkerPromise;
}
getFaceLandmarker().catch(() => {});

// ── ランドマーク定義 ───────────────────────────────────────────────────────
const IDX = {
  chinTip: 152,
  cheekboneLeft: 123, cheekboneRight: 352,  // 頬骨最張り出し点（旧234/454より内側）
  jawLeft: 172, jawRight: 397,
  jawAngleLeft: 58, jawAngleRight: 288,
  jawMidLeft: 136, jawMidRight: 365,
  noseBottom: 2,
  faceEdgeLeft: 54, faceEdgeRight: 284,   // 額幅（眉上付近・旧127/356より内側）
  eyeOuterLeft: 33, eyeOuterRight: 263,
  eyeInnerLeft: 133, eyeInnerRight: 362,
  glabella: 168, noseTip: 4, philtrum: 164,
  mouthCornerLeft: 61, mouthCornerRight: 291,
  eyeTopLeft: 159, eyeBottomLeft: 145,
  eyeTopRight: 386, eyeBottomRight: 374,
  eyebrowOuterLeft: 46, eyebrowOuterRight: 276,
  noseAlaLeft: 129, noseAlaRight: 358,
  mouthTopCenter: 0,
};
const BROW_TOP_INDICES_L = [52, 53, 65, 105];
const BROW_TOP_INDICES_R = [282, 283, 295, 334];
const FOREHEAD_TOP_INDICES = [10, 109, 338, 67, 297];

function extractNamedLandmarks(raw) {
  const lm = {};
  for (const [name, idx] of Object.entries(IDX)) {
    const p = raw[idx];
    if (p) lm[name] = { x: p.x, y: p.y };
  }

  // 眉上端
  const browTopPtsL = BROW_TOP_INDICES_L.map(i => raw[i]).filter(Boolean);
  const browTopPtsR = BROW_TOP_INDICES_R.map(i => raw[i]).filter(Boolean);
  if (browTopPtsL.length > 0 && browTopPtsR.length > 0) {
    const topL = browTopPtsL.reduce((best, p) => p.y < best.y ? p : best);
    const topR = browTopPtsR.reduce((best, p) => p.y < best.y ? p : best);
    lm.browTop = { x: (topL.x + topR.x) / 2, y: (topL.y + topR.y) / 2 };
  }
  lm.browBottom = lm.browTop;
  lm.browLine   = lm.browTop;

  // 生え際: 額メッシュ点の最上点をそのまま使用（外挿なし）
  const foreheadTopPts = FOREHEAD_TOP_INDICES.map(i => raw[i]).filter(Boolean);
  if (foreheadTopPts.length > 0 && lm.browTop) {
    const meshTopPt = foreheadTopPts.reduce((best, p) => p.y < best.y ? p : best);
    lm.hairline = {
      x: meshTopPt.x,
      y: Math.min(meshTopPt.y, lm.browTop.y),
    };
  } else if (lm.browTop) {
    lm.hairline = { x: lm.browTop.x, y: lm.browTop.y };
  }

  // 瞳孔中心
  const avg = pts => ({ x: pts.reduce((s,p)=>s+p.x,0)/pts.length, y: pts.reduce((s,p)=>s+p.y,0)/pts.length });
  if (lm.eyeOuterLeft && lm.eyeInnerLeft && lm.eyeTopLeft && lm.eyeBottomLeft)
    lm.pupilLeft = avg([lm.eyeOuterLeft, lm.eyeInnerLeft, lm.eyeTopLeft, lm.eyeBottomLeft]);
  if (lm.eyeOuterRight && lm.eyeInnerRight && lm.eyeTopRight && lm.eyeBottomRight)
    lm.pupilRight = avg([lm.eyeOuterRight, lm.eyeInnerRight, lm.eyeTopRight, lm.eyeBottomRight]);

  return lm;
}

// ── 顔型 ──────────────────────────────────────────────────────────────────
const FACE_SHAPE_NOTES = {
  卵型:          "縦横バランスが取れた最もベーシックな輪郭。多彩なスタイルが似合います",
  丸型:          "縦横比が近く、頬の丸みが柔らかく親しみやすい印象の輪郭です",
  面長:          "縦の比率が高く、額から顎までが長めの知的でエレガントな輪郭です",
  ベース型:      "頬骨・顎のラインがしっかりした、安定感のある力強い印象の輪郭です",
  逆三角形:      "額・頬骨が広く顎が細い、シャープで洗練された印象の輪郭です",
  ダイヤモンド型: "頬骨の張りが最も広く、立体感のある個性的な輪郭です",
};

const ASSUMED_PUPIL_DISTANCE_CM = 6.3;

function toPx(p, w, h) { return p ? { x: p.x*w, y: p.y*h } : null; }
function distPx(a, b) { return (a && b) ? Math.hypot(a.x-b.x, a.y-b.y) : null; }

function computeMeasurements(lm, imgW, imgH) {
  if (!lm || !imgW || !imgH) return null;
  const px = {};
  Object.keys(lm).forEach(k => { px[k] = toPx(lm[k], imgW, imgH); });

  const pupilDistPx = distPx(px.pupilLeft, px.pupilRight);
  const cmPerPx = pupilDistPx ? ASSUMED_PUPIL_DISTANCE_CM / pupilDistPx : null;
  const toCm = v => (cmPerPx && v != null) ? Math.round(v * cmPerPx * 10) / 10 : null;

  const faceHeightPx    = distPx(px.hairline, px.chinTip);
  const faceWidthPx     = distPx(px.cheekboneLeft, px.cheekboneRight);
  const faceRatio       = (faceHeightPx && faceWidthPx) ? faceHeightPx / faceWidthPx : null;
  const jawWidthPx      = distPx(px.jawLeft, px.jawRight);
  const jawAngleWidthPx = distPx(px.jawAngleLeft, px.jawAngleRight);
  const foreheadWidthPx = distPx(px.faceEdgeLeft, px.faceEdgeRight);

  // 顎ラインの直線性スコア
  let jawLinearityScore = null;
  if (px.jawAngleLeft && px.jawMidLeft && px.chinTip && px.jawAngleRight && px.jawMidRight) {
    const calcCurv = (a, m, e) => {
      const len = Math.hypot(e.x-a.x, e.y-a.y) || 1;
      return Math.abs((e.y-a.y)*m.x - (e.x-a.x)*m.y + e.x*a.y - e.y*a.x) / len / (faceWidthPx||1);
    };
    jawLinearityScore = (calcCurv(px.jawAngleLeft, px.jawMidLeft, px.chinTip) +
                         calcCurv(px.jawAngleRight, px.jawMidRight, px.chinTip)) / 2;
  }

  // 顔型判定（幅の比率メイン・生え際に依存しない）
  // 三分割
  let thirds = null;
  if (px.hairline && px.browTop && px.noseBottom && px.chinTip) {
    const z1 = px.browTop.y    - px.hairline.y;
    const z2 = px.noseBottom.y - px.browTop.y;
    const z3 = px.chinTip.y    - px.noseBottom.y;
    const tot = px.chinTip.y   - px.hairline.y || 1;
    thirds = {
      forehead: Math.round(z1/tot*100), midface: Math.round(z2/tot*100), lowerface: Math.round(z3/tot*100),
      foreheadCm: toCm(z1), midfaceCm: toCm(z2), lowerfaceCm: toCm(z3),
    };
  }


  let faceShape = null;
  if (jawWidthPx && foreheadWidthPx && faceWidthPx && faceHeightPx) {
    const jawToCheek      = jawWidthPx / faceWidthPx;
    const jawAngleToCheek = (jawAngleWidthPx || jawWidthPx * 1.05) / faceWidthPx;
    const foreheadToCheek = foreheadWidthPx / faceWidthPx;
    const widthToHeight   = faceWidthPx / faceHeightPx;
    const isJawLinear = jawLinearityScore !== null && jawLinearityScore < 0.045;
    const isJawCurved = jawLinearityScore !== null && jawLinearityScore > 0.065;

    // ── 実測データ確定版判定フロー ────────────────────────────────────────
    // 判明: 面長も卵型も縦横比・頬骨幅÷顔縦がほぼ同値
    //   面長: 縦横比1.233, 頬骨幅÷顔縦0.811
    //   卵型: 縦横比1.237〜1.257, 頬骨幅÷顔縦0.796〜0.808
    // → widthToHeightや縦横比では区別不可能
    // → 三分割比率（眉〜鼻下 vs 鼻下〜顎先）で面長を判定する
    //   面長の特徴: 中顔（眉〜鼻下）が長い → midface% > lowerface% + 5

    // 三分割データを取得（computeMeasurements内で計算済み）
    const midfacePct  = thirds ? thirds.midface  : null;
    const lowerfacePct= thirds ? thirds.lowerface: null;
    const foreheadPct = thirds ? thirds.forehead : null;

    // 1. ダイヤモンド型: 頬骨が最大幅、額と顎が近い幅
    //    実測: 頬骨張り出しの人は foreheadToCheek が低く jawToCheek も低い
    // ダイヤモンド型の本質:
    // 「頬骨が顎・エラより明確に広い」= 顔の最大幅が頬骨にある
    // 実測: ダイヤ候補のエラ÷頬骨=0.862〜0.87、顎先÷頬骨=0.772〜0.78
    // → 頬骨がエラ・顎先より10〜14%広い
    // foreheadToCheek(額÷頬骨)は実測1.008〜1.012でほぼ1.0 → 使えない
    // 判定: エラ÷頬骨 < 0.88 かつ 顎先÷頬骨 < 0.80 かつ エラ>顎先（頬骨が最大幅）
    const isDiamond = foreheadToCheek < 0.94   // 額が頬骨より狭い（基準点変更後）
                   && jawToCheek < 0.82           // 顎も頬骨より狭い
                   && Math.abs(foreheadToCheek - jawToCheek) < 0.15  // 上下対称
                   && !isBase;

    // 2. ベース型: エラ÷頬骨が高い＋顎ライン直線的
    const isBase = jawAngleToCheek >= 0.86
                && (isJawLinear || jawAngleToCheek >= 0.89);

    // 3. 逆三角形: 額が広く顎が細い
    const isInvTri = foreheadToCheek >= 0.95 && jawToCheek < 0.70;

    // 4. 面長: 中顔比率（眉〜鼻下 ÷ 全体）が高い
    let midPct = null;
    if (px.browTop && px.noseBottom && px.chinTip && px.hairline) {
      const z1 = px.browTop.y    - px.hairline.y;
      const z2 = px.noseBottom.y - px.browTop.y;
      const z3 = px.chinTip.y    - px.noseBottom.y;
      const tot = z1 + z2 + z3 || 1;
      midPct = z2 / tot;
    }
    const isOblong = !isBase && !isDiamond && (
      (midPct !== null && midPct > 0.38) ||
      (widthToHeight < 0.74)
    ) && (faceRatio === null || faceRatio > 1.18);

    // 5. 丸型: 頬骨幅÷顔縦が高い
    const isRound = widthToHeight > 0.85
                 && jawToCheek < 0.88
                 && !isBase && !isDiamond;

    if      (isDiamond) faceShape = "ダイヤモンド型";
    else if (isBase)    faceShape = "ベース型";
    else if (isInvTri)  faceShape = "逆三角形";
    else if (isOblong)  faceShape = "面長";
    else if (isRound)   faceShape = "丸型";
    else                faceShape = "卵型";
  }
  // 五眼・遠心求心
  let fiveEyes = null;
  if (px.faceEdgeLeft && px.eyeOuterLeft && px.eyeInnerLeft && px.eyeInnerRight && px.eyeOuterRight && px.faceEdgeRight) {
    const s1 = px.eyeOuterLeft.x  - px.faceEdgeLeft.x;
    const s2 = px.eyeInnerLeft.x  - px.eyeOuterLeft.x;
    const s3 = px.eyeInnerRight.x - px.eyeInnerLeft.x;
    const s4 = px.eyeOuterRight.x - px.eyeInnerRight.x;
    const s5 = px.faceEdgeRight.x - px.eyeOuterRight.x;
    const tot = px.faceEdgeRight.x - px.faceEdgeLeft.x || 1;
    const eyeSpan = s2 + s3 + s4;
    const innerToEyeSpan = eyeSpan > 0 ? s3/eyeSpan*100 : 0;
    // 実測データ更新:
    // 求心顔3人の実測値: 38.7〜39.1%（旧閾値38%未満では捕捉できない）
    // → 求心: 41%未満 / 標準: 41〜46% / 遠心: 46%超
    let eyeSetType = "標準", eyeSetLabel = "目と目の間が標準的";
    if (innerToEyeSpan < 41) { eyeSetType = "求心"; eyeSetLabel = "目と目の間が狭い（求心型）"; }
    else if (innerToEyeSpan > 46) { eyeSetType = "遠心"; eyeSetLabel = "目と目の間が広い（遠心型）"; }
    fiveEyes = {
      section1: Math.round(s1/tot*100), section1Cm: toCm(s1),
      section2: Math.round(s2/tot*100), section2Cm: toCm(s2),
      section3: Math.round(s3/tot*100), section3Cm: toCm(s3),
      section4: Math.round(s4/tot*100), section4Cm: toCm(s4),
      section5: Math.round(s5/tot*100), section5Cm: toCm(s5),
      innerRatioPct: Math.round(innerToEyeSpan*10)/10,
      eyeSetType, eyeSetLabel,
    };
  }

  // 目サイズ
  let eyeSize = null;
  const ewL = distPx(px.eyeOuterLeft, px.eyeInnerLeft);
  const ewR = distPx(px.eyeOuterRight, px.eyeInnerRight);
  const ehL = distPx(px.eyeTopLeft, px.eyeBottomLeft);
  const ehR = distPx(px.eyeTopRight, px.eyeBottomRight);
  if (ewL && ewR && ehL && ehR) {
    const wDiff = Math.abs(ewL-ewR)/((ewL+ewR)/2)*100;
    const hDiff = Math.abs(ehL-ehR)/((ehL+ehR)/2)*100;
    const lSum = (toCm(ewL)||0)+(toCm(ehL)||0);
    const rSum = (toCm(ewR)||0)+(toCm(ehR)||0);
    eyeSize = {
      widthLeftCm: toCm(ewL), widthRightCm: toCm(ewR),
      heightLeftCm: toCm(ehL), heightRightCm: toCm(ehR),
      widthDiffCm: toCm(Math.abs(ewL-ewR)),
      widthDiffPct: Math.round(wDiff), heightDiffPct: Math.round(hDiff),
      largerSide: lSum>rSum ? "左目の方が大きい" : rSum>lSum ? "右目の方が大きい" : "ほぼ同じ",
    };
  }

  // 左右差スコア
  let symmetry = null;
  const centerPts = [px.glabella, px.noseTip, px.philtrum, px.chinTip].filter(Boolean);
  if (centerPts.length >= 2 && faceWidthPx) {
    const avgX = centerPts.reduce((s,p)=>s+p.x,0)/centerPts.length;
    const cDev = centerPts.reduce((s,p)=>s+Math.abs(p.x-avgX),0)/centerPts.length;
    const cScore = Math.max(0, 100-(cDev/faceWidthPx)*400);
    const pairs = [[px.pupilLeft,px.pupilRight],[px.mouthCornerLeft,px.mouthCornerRight],
                   [px.eyebrowOuterLeft,px.eyebrowOuterRight],[px.noseAlaLeft,px.noseAlaRight]].filter(([l,r])=>l&&r);
    let mScore = 100;
    if (pairs.length > 0) {
      let aSum = 0;
      pairs.forEach(([l,r]) => { const dl=Math.abs(avgX-l.x),dr=Math.abs(r.x-avgX); aSum+=Math.abs(dl-dr)/((dl+dr)/2||1); });
      mScore = Math.max(0, 100-(aSum/pairs.length)*100);
    }
    const eScore = eyeSize ? Math.max(0,100-(eyeSize.widthDiffPct+eyeSize.heightDiffPct)) : 100;
    symmetry = Math.round((cScore+mScore+eScore)/3);
  }

  const goldenRatio = faceRatio ? Math.min(100, Math.max(0, Math.round(100-Math.abs(faceRatio-1.618)*60))) : null;

  // デバッグ数値
  const debug = faceWidthPx ? {
    faceRatio:       faceRatio        ? Math.round(faceRatio*1000)/1000 : null,
    jawToCheek:      jawWidthPx       ? Math.round(jawWidthPx/faceWidthPx*1000)/1000 : null,
    jawAngleToCheek: jawAngleWidthPx  ? Math.round(jawAngleWidthPx/faceWidthPx*1000)/1000 : null,
    foreheadToCheek: foreheadWidthPx  ? Math.round(foreheadWidthPx/faceWidthPx*1000)/1000 : null,
    widthToHeight:   faceHeightPx     ? Math.round(faceWidthPx/faceHeightPx*1000)/1000 : null,
  } : null;

  return {
    faceHeightCm: toCm(faceHeightPx), faceWidthCm: toCm(faceWidthPx),
    faceRatio: faceRatio ? Math.round(faceRatio*100)/100 : null,
    thirds, fiveEyes, symmetry, eyeSize, goldenRatio, faceShape,
    calibrated: !!cmPerPx, debug, jawLinearity: jawLinearityScore,
  };
}

// ── 画像ユーティリティ ────────────────────────────────────────────────────
function fileToDataUrl(file) {
  return new Promise((res,rej) => { const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("読込失敗")); r.readAsDataURL(file); });
}
function loadImageEl(src) {
  return new Promise((res,rej) => { const img=new Image(); img.onload=()=>res(img); img.onerror=()=>rej(new Error("デコード失敗")); img.src=src; });
}
function getCoverGeometry(cW,cH,iW,iH,zoom) {
  const base=Math.max(cW/iW,cH/iH), scale=base*zoom;
  const dW=iW*scale, dH=iH*scale;
  return { scale, dW, dH, maxPanX:dW>=cW?(dW-cW)/2:(cW-dW)/2+dW/2, maxPanY:dH>=cH?(dH-cH)/2:(cH-dH)/2+dH/2 };
}

// ── ガイドSVG ─────────────────────────────────────────────────────────────
function faceGuideSVG(opacity) {
  const hairline=90, chin=355, faceH=chin-hairline, third=faceH/3;
  const browLine=hairline+third, noseLine=hairline+third*2;
  const cy=(hairline+chin)/2, ry=faceH/2, rx=95;
  return `<svg id="adjustGuide" viewBox="0 0 300 400" style="opacity:${opacity}">
    <ellipse cx="150" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#C6A15B" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="55" y1="${hairline}" x2="245" y2="${hairline}" stroke="#C6A15B88" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="248" y="${hairline+4}" fill="#C6A15B" font-size="9" opacity="0.7">生え際</text>
    <line x1="40" y1="${browLine}" x2="260" y2="${browLine}" stroke="#C6A15B" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.9"/>
    <text x="264" y="${browLine+4}" fill="#C6A15B" font-size="9">眉</text>
    <line x1="40" y1="${noseLine}" x2="260" y2="${noseLine}" stroke="#C6A15B" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.9"/>
    <text x="264" y="${noseLine+4}" fill="#C6A15B" font-size="9">鼻下</text>
    <line x1="55" y1="${chin}" x2="245" y2="${chin}" stroke="#C6A15B88" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="248" y="${chin+4}" fill="#C6A15B" font-size="9" opacity="0.7">顎先</text>
    <line x1="150" y1="${hairline-5}" x2="150" y2="${chin+5}" stroke="#F4EFE4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
    <text x="12" y="${hairline+third*0.5}" fill="#C6A15B66" font-size="9">①額</text>
    <text x="12" y="${browLine+third*0.5}" fill="#C6A15B66" font-size="9">②中</text>
    <text x="12" y="${noseLine+third*0.5}" fill="#C6A15B66" font-size="9">③下</text>
  </svg>`;
}

function thirdsCard(t) {

    {label:"② 中顔", range:"眉→鼻下", pct:t.midface, cm:t.midfaceCm},
    {label:"③ 下顔", range:"鼻下→顎先", pct:t.lowerface, cm:t.lowerfaceCm},

  return `<div class="thirds-guide">${zones.map(z=>`
    <div class="thirds-zone">
      <div><div class="zone-label">${z.label}</div><div class="zone-range">${z.range}</div></div>
      <div><div class="zone-val">${z.cm!=null?z.cm+"cm":"-"}</div><div class="zone-pct">${z.pct}%</div></div>

function downloadPdf() {
  const html = buildWorksheetHTML();
  const blob = new Blob([html], {type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const win = window.open(url, "_blank");
  if (!win) { alert("ポップアップがブロックされました。ブラウザの設定でポップアップを許可してください。"); URL.revokeObjectURL(url); return; }
  win.addEventListener("load", () => {
    setTimeout(() => { win.focus(); win.print(); win.addEventListener("afterprint",()=>URL.revokeObjectURL(url)); }, 600);
  });
}

// ── イベント配線 ──────────────────────────────────────────────────────────
function wireNormalCard() {
  const previewArea   = document.getElementById("previewArea");
  const albumInput    = document.getElementById("fileInputAlbum");
  const cameraInput   = document.getElementById("fileInputCamera");
  document.getElementById("pickAlbumBtn")?.addEventListener("click", ()=>albumInput.click());
  document.getElementById("pickCameraBtn")?.addEventListener("click", ()=>cameraInput.click());
  if (previewArea && !state.imgSrc && state.status!=="loading")
    previewArea.addEventListener("click", ()=>albumInput?.click());
  albumInput?.addEventListener("change",  e=>handleFile(e.target.files?.[0]));
  cameraInput?.addEventListener("change", e=>handleFile(e.target.files?.[0]));
  document.getElementById("analyzeBtn")?.addEventListener("click", runAnalysis);
  document.getElementById("backToAdjustBtn")?.addEventListener("click", ()=>{state.status="adjusting";render();});
  document.getElementById("resetBtn")?.addEventListener("click", resetAll);
  document.getElementById("downloadPdfBtn")?.addEventListener("click", downloadPdf);
  document.querySelectorAll(".bar-fill").forEach(el => {
    const pct = Number(el.dataset.pct)||0;
    requestAnimationFrame(()=>{ el.style.width=pct+"%"; });
  });
  if (state.status==="done" && state.landmarks468) drawLandmarkCanvas();
}

let dragState = null;
function wireAdjustCard() {
  const stage  = document.getElementById("adjustStage");
  const img    = document.getElementById("adjustImg");
  const slider = document.getElementById("zoomSlider");
  const confirmBtn = document.getElementById("confirmCropBtn");
  const resetBtn   = document.getElementById("adjustResetBtn");

  const applyTransform = () => { img.style.transform=`translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})`; };
  applyTransform();

  const clampPan = (next,zoom) => {
    const rect = stage.getBoundingClientRect();
    const {maxPanX,maxPanY} = getCoverGeometry(rect.width,rect.height,state.rawImage.width,state.rawImage.height,zoom);
    return {x:Math.max(-maxPanX,Math.min(maxPanX,next.x)),y:Math.max(-maxPanY,Math.min(maxPanY,next.y))};
  };

  stage.addEventListener("pointerdown", e=>{stage.setPointerCapture(e.pointerId);stage.classList.add("dragging");dragState={x:e.clientX,y:e.clientY,panX:state.pan.x,panY:state.pan.y};});
  stage.addEventListener("pointermove", e=>{if(!dragState)return;state.pan=clampPan({x:dragState.panX+(e.clientX-dragState.x),y:dragState.panY+(e.clientY-dragState.y)},state.zoom);applyTransform();});
  const endDrag = ()=>{dragState=null;stage.classList.remove("dragging");};
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  slider.addEventListener("input", e=>{state.zoom=Number(e.target.value);state.pan=clampPan(state.pan,state.zoom);applyTransform();});

  confirmBtn.addEventListener("click", ()=>{
    const rect=stage.getBoundingClientRect();
    const cW=rect.width,cH=rect.height,outW=750,outH=Math.round(outW*(cH/cW));
    const {dW,dH}=getCoverGeometry(cW,cH,state.rawImage.width,state.rawImage.height,state.zoom);
    const cs=outW/cW;
    const canvas=document.createElement("canvas");canvas.width=outW;canvas.height=outH;
    const ctx=canvas.getContext("2d");ctx.fillStyle="#141210";ctx.fillRect(0,0,outW,outH);
    ctx.drawImage(state.rawImage.source,(cW/2+state.pan.x-dW/2)*cs,(cH/2+state.pan.y-dH/2)*cs,dW*cs,dH*cs);
    state.imgSrc=canvas.toDataURL("image/jpeg",0.85);
    state.imgW=outW;state.imgH=outH;state.status="ready";state.landmarks468=null;state.measurements=null;
    render();
  });
  resetBtn.addEventListener("click", resetAll);
}

// ── ファイル処理・解析 ─────────────────────────────────────────────────────
async function handleFile(file) {
  if (!file||!file.type.startsWith("image/")) { state.errorMsg="画像ファイルを選択してください"; state.status="error"; render(); return; }
  state.errorMsg="";state.imgSrc=null;state.status="loading";render();
  try {
    const rawDataUrl=await fileToDataUrl(file);
    const img=await loadImageEl(rawDataUrl);
    state.rawImage={source:img,displayUrl:rawDataUrl,width:img.naturalWidth||img.width,height:img.naturalHeight||img.height};
    state.zoom=1.15;state.pan={x:0,y:0};state.status="adjusting";
  } catch(e) { state.errorMsg=`画像の読み込みに失敗しました（${e?.message}）`; state.status="error"; }
  render();
}

function resetAll() {
  Object.assign(state,{status:"idle",imgSrc:null,imgW:0,imgH:0,rawImage:null,zoom:1,pan:{x:0,y:0},
    landmarks468:null,namedLandmarks:null,measurements:null,faceShape:null,errorMsg:""});
  render();
}

async function runAnalysis() {
  if (!state.imgSrc) return;
  state.status="analyzing";state.errorMsg="";render();
  try {
    const landmarker=await getFaceLandmarker();
    const imgEl=await loadImageEl(state.imgSrc);
    const result=landmarker.detect(imgEl);
    if (!result.faceLandmarks||result.faceLandmarks.length===0)
      throw new Error("顔を検出できませんでした。正面を向いた、顔全体が写る写真でお試しください。");
    const raw=result.faceLandmarks[0];
    const named=extractNamedLandmarks(raw);
    const measurements=computeMeasurements(named,state.imgW,state.imgH);
    state.landmarks468=raw;state.namedLandmarks=named;
    state.measurements=measurements;state.faceShape=measurements?.faceShape??null;
    state.status="done";
  } catch(e) { state.errorMsg=`計測に失敗しました（${e?.message}）`; state.status="error"; }
  render();
}

// ── ランドマーク描画 ──────────────────────────────────────────────────────
function drawLandmarkCanvas() {
  const canvas=document.getElementById("landmarkCanvas");
  if (!canvas||!state.landmarks468) return;
  const w=state.imgW,h=state.imgH;
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#00FF66";
  state.landmarks468.forEach((p,i)=>{if(i>=468)return;ctx.beginPath();ctx.arc(p.x*w,p.y*h,Math.max(1,w*0.0022),0,Math.PI*2);ctx.fill();});
  const lm=state.namedLandmarks;
  if (lm) {
    const px=p=>({x:p.x*w,y:p.y*h});
    if (lm.hairline&&lm.browTop&&lm.noseBottom&&lm.chinTip) {
      [{pt:lm.hairline,label:"生え際"},{pt:lm.browTop,label:"眉"},{pt:lm.noseBottom,label:"鼻下"},{pt:lm.chinTip,label:"顎先"}].forEach(({pt,label})=>{
        const {y}=px(pt);
        ctx.strokeStyle="rgba(198,161,91,0.85)";ctx.lineWidth=2;ctx.setLineDash([6,4]);
        ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle="rgba(198,161,91,0.95)";ctx.font=`bold ${Math.max(12,w*0.018)}px 'Noto Sans JP',sans-serif`;
        ctx.fillText(label,8,y-4);
      });
    }
    ctx.fillStyle="#C6A15B";
    Object.values(lm).forEach(p=>{const {x,y}=px(p);ctx.beginPath();ctx.arc(x,y,Math.max(2,w*0.006),0,Math.PI*2);ctx.fill();ctx.strokeStyle="#0B0B0A";ctx.lineWidth=1;ctx.stroke();ctx.fillStyle="#C6A15B";});
  }
}

render();
</script>
